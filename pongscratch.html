<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Juego Scratch</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b1120;
            color: #e5e7eb;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px;
            box-sizing: border-box;
        }

        a.btn {
            align-self: flex-start;
            margin-bottom: 10px;
            padding: 6px 12px;
            border-radius: 8px;
            background: #111827;
            color: #e5e7eb;
            text-decoration: none;
            font-size: 14px;
            border: 1px solid #1f2937;
        }

        h1 {
            font-size: 20px;
            margin: 4px 0 10px 0;
            text-align: center;
        }

        .frame-wrap {
            width: 100%;
            max-width: 500px;
            aspect-ratio: 4 / 3;
            background: #020617;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid #1f2937;
        }

        .frame-wrap iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }

        p {
            font-size: 13px;
            color: #9ca3af;
            margin-top: 8px;
            text-align: center;
            max-width: 500px;
        }
    </style>
</head>

<body>
    <a href="index.html" class="btn">⬅ Volver al menú</a>

    <h1>🎮 Juego Scratch</h1>

    <div class="frame-wrap">
        <iframe src="https://scratch.mit.edu/projects/1243436877/embed" allowtransparency="true"
            allowfullscreen></iframe>
    </div>

    <p>
        Si el juego no se ve bien en el celular, probá girar la pantalla a horizontal.
    </p>
</body>

</html>
