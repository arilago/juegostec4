<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎮 Juegos Clásicos</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f0f0f0;
      margin: 0;
      padding-bottom: 120px;
      /* espacio para los controles móviles */
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 10px;
    }

    .tab {
      padding: 10px 15px;
      background: #ccc;
      margin: 5px;
      border-radius: 5px;
      cursor: pointer;
    }

    .tab.active {
      background: #666;
      color: white;
    }

    .content {
      display: none;
      padding: 20px;
      border: 1px solid #ccc;
      border-top: none;
      background: white;
      max-width: 320px;
      margin: 0 auto;
    }

    .content.active {
      display: block;
    }

    canvas {
      max-width: 100%;
      border: 1px solid black;
      background: #000;
      display: block;
      margin: 0 auto;
    }

    #scoreDisplay {
      font-size: 1.2em;
      margin: 10px 0;
    }

    a.btn {
      display: inline-block;
      margin: 10px 0;
      padding: 8px 14px;
      background: #444;
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
    }

    /* ===== Controles móviles ===== */
    #mobile-controls {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 8px;
      padding: 8px 12px;
      display: grid;
      grid-template-columns: 2fr 1.2fr;
      gap: 10px;
      z-index: 9999;
      touch-action: manipulation;
    }

    #mobile-controls button {
      background: #1f2937;
      color: #e5e7eb;
      border: 1px solid #374151;
      border-radius: 10px;
      min-width: 58px;
      min-height: 46px;
      font-size: 18px;
      box-shadow: 0 6px 14px rgba(0, 0, 0, .35);
    }

    .dpad {
      display: grid;
      grid-template-areas:
        ". up ."
        "left . right"
        ". down .";
      gap: 6px;
      justify-items: center;
      align-items: center;
    }

    .dpad .btn-key[data-key="ArrowUp"] {
      grid-area: up;
    }

    .dpad .btn-key[data-key="ArrowDown"] {
      grid-area: down;
    }

    .dpad .btn-key[data-key="ArrowLeft"] {
      grid-area: left;
    }

    .dpad .btn-key[data-key="ArrowRight"] {
      grid-area: right;
    }

    .actions {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .actions .btn-key {
      width: 100%;
      min-height: 64px;
      font-size: 18px;
      font-weight: 700;
      background: #ef4444;
      border-color: #b91c1c;
      color: #111;
    }

    /* En pantallas grandes no muestro los controles táctiles */
    @media (min-width: 769px) {
      #mobile-controls {
        display: none;
      }
    }
  </style>
</head>

<body>

  <a href="index.html" class="btn">⬅ Volver al menú</a>
  <div id="scoreDisplay">Puntuación: 0</div>
  <div class="tabs" id="tabsContainer"></div>
  <div id="contentsContainer"></div>

  <!-- Controles táctiles para móvil -->
  <div id="mobile-controls">
    <div class="dpad">
      <button class="btn-key" data-key="ArrowUp">⟳</button>
      <button class="btn-key" data-key="ArrowLeft">⬅</button>
      <button class="btn-key" data-key="ArrowDown">⬇</button>
      <button class="btn-key" data-key="ArrowRight">➡</button>
    </div>
    <div class="actions">
      <button class="btn-key" data-key="ArrowDown">⬇ RÁPIDO</button>
    </div>
  </div>

  <!-- 🎵 Música 8-bit (fuera del script) -->
  <audio src="musica8bit.mp3" autoplay loop></audio>

  <script>
    const juegos = [
      { nombre: "Tetris", tipo: "canvas", id: "tetrisCanvas" }
    ];

    const tabsContainer = document.getElementById('tabsContainer');
    const contentsContainer = document.getElementById('contentsContainer');

    juegos.forEach((juego, index) => {
      const tab = document.createElement('div');
      tab.className = 'tab' + (index === 0 ? ' active' : '');
      tab.textContent = juego.nombre;
      tab.onclick = () => showTab(index);
      tabsContainer.appendChild(tab);

      const content = document.createElement('div');
      content.className = 'content' + (index === 0 ? ' active' : '');
      const canvas = document.createElement('canvas');
      canvas.id = juego.id;
      canvas.width = 240;
      canvas.height = 400;
      content.appendChild(canvas);
      contentsContainer.appendChild(content);
    });

    function showTab(index) {
      document.querySelectorAll('.tab').forEach((tab, i) =>
        tab.classList.toggle('active', i === index));
      document.querySelectorAll('.content').forEach((content, i) =>
        content.classList.toggle('active', i === index));
    }

    // Evitar que las flechas hagan scroll en la página
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowUp' || e.key === 'ArrowDown' ||
        e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === ' ') {
        e.preventDefault();
      }
    }, { passive: false });

    window.onload = () => iniciarTetris();

    function iniciarTetris() {
      const canvas = document.getElementById('tetrisCanvas');
      if (!canvas) return;
      const context = canvas.getContext('2d');
      context.scale(20, 20);

      const arena = createMatrix(12, 20);
      const player = {
        pos: { x: 0, y: 0 },
        matrix: null
      };

      let score = 0;
      const scoreDisplay = document.getElementById('scoreDisplay');

      function updateScore() {
        scoreDisplay.textContent = 'Puntuación: ' + score;
      }

      function createMatrix(w, h) {
        const matrix = [];
        while (h--) matrix.push(new Array(w).fill(0));
        return matrix;
      }

      function createPiece(type) {
        if (type === 'T') {
          return [
            [0, 1, 0],
            [1, 1, 1],
            [0, 0, 0]
          ];
        } else if (type === 'O') {
          return [
            [2, 2],
            [2, 2]
          ];
        } else if (type === 'L') {
          return [
            [0, 0, 3],
            [3, 3, 3],
            [0, 0, 0]
          ];
        } else if (type === 'I') {
          return [
            [0, 4, 0, 0],
            [0, 4, 0, 0],
            [0, 4, 0, 0],
            [0, 4, 0, 0]
          ];
        } else if (type === 'S') {
          return [
            [0, 5, 5],
            [5, 5, 0],
            [0, 0, 0]
          ];
        } else if (type === 'Z') {
          return [
            [6, 6, 0],
            [0, 6, 6],
            [0, 0, 0]
          ];
        }
      }

      function drawMatrix(matrix, offset) {
        matrix.forEach((row, y) => {
          row.forEach((value, x) => {
            if (value) {
              context.fillStyle = 'cyan';
              context.fillRect(x + offset.x, y + offset.y, 1, 1);
            }
          });
        });
      }

      function merge(arena, player) {
        player.matrix.forEach((row, y) => {
          row.forEach((value, x) => {
            if (value) {
              arena[y + player.pos.y][x + player.pos.x] = value;
            }
          });
        });
      }

      function collide(arena, player) {
        const [m, o] = [player.matrix, player.pos];
        for (let y = 0; y < m.length; ++y) {
          for (let x = 0; x < m[y].length; ++x) {
            if (m[y][x] &&
              (arena[y + o.y] &&
                arena[y + o.y][x + o.x]) !== 0) {
              return true;
            }
          }
        }
        return false;
      }

      function playerReset() {
        const pieces = 'TOLISZ';
        player.matrix = createPiece(pieces[Math.floor(Math.random() * pieces.length)]);
        player.pos.y = 0;
        player.pos.x = Math.floor(arena[0].length / 2) - Math.floor(player.matrix[0].length / 2);
        if (collide(arena, player)) {
          arena.forEach(row => row.fill(0));
          score = 0;
          updateScore();
        }
      }

      function playerDrop() {
        player.pos.y++;
        if (collide(arena, player)) {
          player.pos.y--;
          merge(arena, player);
          arenaSweep();
          playerReset();
        }
        dropCounter = 0;
      }

      function playerMove(dir) {
        player.pos.x += dir;
        if (collide(arena, player)) {
          player.pos.x -= dir;
        }
      }

      function rotate(matrix) {
        for (let y = 0; y < matrix.length; ++y) {
          for (let x = 0; x < y; ++x) {
            [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
          }
        }
        matrix.forEach(row => row.reverse());
      }

      function playerRotate() {
        const pos = player.pos.x;
        let offset = 1;
        rotate(player.matrix);
        while (collide(arena, player)) {
          player.pos.x += offset;
          offset = -(offset + (offset > 0 ? 1 : -1));
          if (offset > player.matrix[0].length) {
            // revertir rotación
            rotate(player.matrix);
            rotate(player.matrix);
            rotate(player.matrix);
            player.pos.x = pos;
            return;
          }
        }
      }

      function arenaSweep() {
        outer: for (let y = arena.length - 1; y >= 0; --y) {
          for (let x = 0; x < arena[y].length; ++x) {
            if (arena[y][x] === 0) continue outer;
          }
          const row = arena.splice(y, 1)[0].fill(0);
          arena.unshift(row);
          y++;
          score += 10;
          updateScore();
        }
      }

      function draw() {
        context.fillStyle = '#000';
        context.fillRect(0, 0, canvas.width, canvas.height);
        drawMatrix(arena, { x: 0, y: 0 });
        drawMatrix(player.matrix, player.pos);
      }

      let dropCounter = 0;
      let lastTime = 0;

      function update(time = 0) {
        const deltaTime = time - lastTime;
        lastTime = time;
        dropCounter += deltaTime;
        if (dropCounter > 1000) {
          playerDrop();
        }
        draw();
        requestAnimationFrame(update);
      }

      document.addEventListener('keydown', event => {
        if (event.key === 'ArrowLeft') {
          event.preventDefault();
          playerMove(-1);
        } else if (event.key === 'ArrowRight') {
          event.preventDefault();
          playerMove(1);
        } else if (event.key === 'ArrowDown') {
          event.preventDefault();
          playerDrop();
        } else if (event.key === 'ArrowUp') {
          event.preventDefault();
          playerRotate();
        }
      });

      playerReset();
      update();
    }

    // ==== Controles táctiles: disparan eventos de teclado ====
    function sendKey(key) {
      let eventKey = key;
      let eventCode = key;

      if (key === 'Space') {
        eventKey = ' ';
        eventCode = 'Space';
      }

      const ev = new KeyboardEvent('keydown', {
        key: eventKey,
        code: eventCode,
        bubbles: true
      });
      document.dispatchEvent(ev);
    }

    function attachTap(btn, key) {
      const handler = (e) => {
        e.preventDefault();
        sendKey(key);
      };
      btn.addEventListener('touchstart', handler, { passive: false });
      btn.addEventListener('mousedown', handler);
    }

    window.addEventListener('load', () => {
      const buttons = document.querySelectorAll('#mobile-controls .btn-key');
      buttons.forEach(btn => {
        const key = btn.dataset.key;
        attachTap(btn, key);
      });
    });
  </script>
</body>

</html>
